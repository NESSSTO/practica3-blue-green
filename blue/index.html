<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>NestoTech Store v1.0</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f1f5f9;color:#0f172a}
  header{background:#1e3a8a;color:#fff;padding:18px 32px;display:flex;justify-content:space-between;align-items:center}
  .badge{background:#3b82f6;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:bold}
  .container{max-width:850px;margin:28px auto;padding:0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .card{background:#fff;padding:18px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  button{background:#1d4ed8;color:#fff;border:none;padding:9px 14px;border-radius:6px;cursor:pointer;width:100%;font-weight:600}
  .cart{background:#fff;margin-top:24px;padding:18px;border-radius:10px;border-left:5px solid #1e3a8a}
</style>
</head>
<body>
<header>
  <div><strong>NestoTech Store</strong> — Edición Clásica</div>
  <span class="badge">AMBIENTE BLUE | v1.0.0 (Producción)</span>
</header>
<div class="container">
  <h2>Catálogo Disponible</h2>
  <div class="grid">
    <div class="card"><h3>Teclado Mecánico</h3><p>$1,200 MXN</p><button onclick="add('Teclado Mecánico',1200)">Agregar</button></div>
    <div class="card"><h3>Mouse Inalámbrico</h3><p>$650 MXN</p><button onclick="add('Mouse Inalámbrico',650)">Agregar</button></div>
    <div class="card"><h3>Audífonos Studio</h3><p>$1,850 MXN</p><button onclick="add('Audífonos Studio',1850)">Agregar</button></div>
  </div>
  <div class="cart">
    <h3>Carrito de Compras (<span id="count">0</span> artículos)</h3>
    <ul id="items"></ul>
    <p><strong>Total: $<span id="total">0</span> MXN</strong></p>
  </div>
</div>
<script>
  let total=0, count=0;
  function add(n,p){
    count++; total+=p;
    document.getElementById('count').innerText=count;
    document.getElementById('total').innerText=total;
    const li=document.createElement('li'); li.textContent=`${n} - $${p} MXN`;
    document.getElementById('items').appendChild(li);
  }
</script>
</body>
</html>
