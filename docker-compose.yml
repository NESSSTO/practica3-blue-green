services:
  tienda-blue:
    image: nginx:alpine
    container_name: nestotech-blue
    volumes:
      - ./blue:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/api/status.json"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - nestotech_mesh_net

  tienda-green:
    image: nginx:alpine
    container_name: nestotech-green
    volumes:
      - ./green:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/api/status.json"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - nestotech_mesh_net

  proxy-gateway:
    image: nginx:alpine
    container_name: nestotech-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      tienda-blue:
        condition: service_healthy
      tienda-green:
        condition: service_healthy
    networks:
      - nestotech_mesh_net

networks:
  nestotech_mesh_net:
    driver: bridge
